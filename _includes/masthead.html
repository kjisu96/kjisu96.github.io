<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="lab-nav" aria-label="Main site navigation">
        <a class="lab-brand" href="/#home" aria-label="Jisu Kwon Research home">
          <span class="lab-brand__mark" aria-hidden="true">JK</span>
          <span class="lab-brand__divider" aria-hidden="true"></span>
          <span class="lab-brand__institution">KAIST</span>
        </a>

        <div class="lab-nav__links">
          {% for link in site.data.navigation.main %}
            <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
          {% endfor %}
          <a href="{{ site.author.cv }}">CV</a>
        </div>

        <details class="lab-nav__mobile">
          <summary aria-label="Open navigation"><span class="navicon"></span></summary>
          <div class="lab-nav__mobile-links">
            {% for link in site.data.navigation.main %}
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            {% endfor %}
            <a href="{{ site.author.cv }}">CV</a>
          </div>
        </details>
      </nav>
    </div>
  </div>
</header>
